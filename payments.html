<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفع - FAST NET</title>

<style>
body { 
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
    padding:20px; 
    direction:rtl; 
    background: linear-gradient(135deg, #f0f4ff, #f9fafc);
    color:#333;
}

h1 { text-align:center; color:#1a237e; }

.back-btn { 
    background:#1a237e; color:#fff; padding:12px 25px;
    border:none; border-radius:8px; cursor:pointer;
}

table { width:100%; border-collapse:collapse; margin-top:15px; background:#fff; }
th,td { border:1px solid #ddd; padding:10px; text-align:center; font-size:16px; }

button { padding:6px 10px; border:none; border-radius:5px; cursor:pointer; }

.pay-btn { background:#ffc107; }
.print-btn { background:#28a745; color:white; }
.wa-btn { background:#25d366; color:white; }

.status-paid { background:#388e3c; color:white; padding:5px 10px; border-radius:8px; }
.status-partial { background:#f57c00; color:white; padding:5px 10px; border-radius:8px; }
.status-unpaid { background:#c62828; color:white; padding:5px 10px; border-radius:8px; }
</style>
</head>

<body>

<h1>الدفع - FAST NET</h1>
<button class="back-btn" onclick="location.href='index.html'">رجوع</button>

<table>
<thead>
<tr>
<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>الإشتراك</th>
<th>المدفوع</th>
<th>المتبقي</th>
<th>الحالة</th>
<th>دفع</th>
<th>طباعة</th>
<th>واتساب</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* Firebase */
const app = initializeApp({
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DB",
  projectId: "YOUR_ID"
});

const db = getDatabase(app);

const tbody = document.getElementById("tbody");

let dataList = [];

/* Bluetooth */
let device;
let characteristic;

async function connectPrinter() {
    device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: ["000018f0-0000-1000-8000-00805f9b34fb"]
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService("000018f0-0000-1000-8000-00805f9b34fb");
    characteristic = await service.getCharacteristic("00002af1-0000-1000-8000-00805f9b34fb");
}

async function printPOS(sub) {
    const last = sub.payments?.[sub.payments.length - 1];

    const text =
`FAST NET
----------------
الاسم: ${sub.name}
الهاتف: ${sub.phone}
المبلغ: ${last?.amount || 0}
----------------\n\n\n`;

    const encoder = new TextEncoder();
    const data = encoder.encode("\x1B\x40" + text);

    await characteristic.writeValue(data);
}

/* Render Table */
function render(data){
    tbody.innerHTML = "";

    data.forEach((sub, i)=>{
        const paid = sub.payments.reduce((a,b)=>a+Number(b.amount||0),0);
        const remaining = sub.price - paid;

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${i+1}</td>
            <td>${sub.name}</td>
            <td>${sub.phone}</td>
            <td>${sub.price}</td>
            <td>${paid}</td>
            <td>${remaining}</td>
            <td>
                ${remaining<=0 
                    ? '<span class="status-paid">مدفوع</span>' 
                    : '<span class="status-partial">غير مكتمل</span>'}
            </td>
            <td><input type="number" class="amount"></td>
            <td><button class="print-btn">طباعة</button></td>
            <td><button class="wa-btn">واتساب</button></td>
        `;

        /* دفع */
        tr.querySelector(".pay-btn")?.addEventListener("click", async ()=>{});

        /* طباعة */
        tr.querySelector(".print-btn").addEventListener("click", async ()=>{
            if(sub.payments.length === 0){
                alert("لا توجد دفعات");
                return;
            }

            if(!characteristic){
                await connectPrinter();
            }

            await printPOS(sub);
        });

        /* واتساب */
        tr.querySelector(".wa-btn").addEventListener("click", ()=>{
            const msg = `إشعار دفع\nالاسم: ${sub.name}\nالمبلغ: ${paid}`;
            window.open(`https://wa.me/${sub.phone}?text=${encodeURIComponent(msg)}`);
        });

        tbody.appendChild(tr);
    });
}

/* Firebase */
onValue(ref(db,"subscribers"), snap=>{
    const val = snap.val() || {};

    dataList = Object.values(val).map(v=>({
        name: v.name,
        phone: v.phone,
        price: Number(v.price||0),
        payments: Array.isArray(v.payments) ? v.payments : []
    }));

    render(dataList);
});
</script>

</body>
</html>
