<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفع - FAST NET</title>

<style>
body {
    font-family: Arial;
    direction: rtl;
    padding: 20px;
    background: #f5f7ff;
}

h1 { text-align:center; color:#1a237e; }

.back-btn {
    background:#1a237e;
    color:#fff;
    padding:12px 25px;
    border:none;
    border-radius:6px;
    margin-bottom:10px;
    cursor:pointer;
}

table {
    width:100%;
    border-collapse:collapse;
    background:white;
}

th, td {
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th { background:#007bff; color:white; }

button {
    padding:6px 10px;
    border:none;
    cursor:pointer;
}

.print-btn { background:#28a745; color:white; }
.pay-btn { background:#ffc107; }

.status-paid { background:green; color:white; padding:5px; }
.status-partial { background:orange; color:white; }
.status-unpaid { background:red; color:white; }

</style>
</head>

<body>

<h1>الدفع - FAST NET</h1>

<button class="back-btn" onclick="window.location.href='index.html'">رجوع</button>
<button onclick="connectPrinter()">🔗 ربط الطابعة</button>

<table>
<thead>
<tr>
<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>العنوان</th>
<th>السعر</th>
<th>المدفوع</th>
<th>المتبقي</th>
<th>طباعة</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA....",
  authDomain: "pos2026-310b7.firebaseapp.com",
  databaseURL: "https://pos2026-310b7-default-rtdb.firebaseio.com",
  projectId: "pos2026-310b7",
  storageBucket: "pos2026-310b7.appspot.com",
  messagingSenderId: "221592625111",
  appId: "1:221592625111:web:81b9704a1fa790bcd0f592"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let bluetoothDevice;
let bluetoothCharacteristic;

/* =======================
   اتصال الطابعة
======================= */
window.connectPrinter = async function () {
    try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
        bluetoothCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

        alert("تم الاتصال بالطابعة");
    } catch (e) {
        alert("خطأ في الاتصال");
        console.log(e);
    }
};

/* =======================
   طباعة عربية (حل صحيح)
======================= */
async function printImage(text) {

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 384;
    canvas.height = 600;

    ctx.fillStyle = "white";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "black";
    ctx.font = "18px Arial";
    ctx.textAlign = "right";

    let y = 30;

    text.split("\n").forEach(line=>{
        ctx.fillText(line, canvas.width-10, y);
        y += 28;
    });

    const imgData = canvas.toDataURL("image/png");
    const res = await fetch(imgData);
    const buffer = await res.arrayBuffer();

    await bluetoothCharacteristic.writeValue(new Uint8Array([0x1B,0x40])); // reset
    await bluetoothCharacteristic.writeValue(new Uint8Array(buffer));
}

/* =======================
   عرض البيانات
======================= */
const table = document.getElementById("table");

onValue(ref(db,"subscribers"), snap=>{
    const data = snap.val() || {};
    table.innerHTML = "";

    Object.values(data).forEach((sub,i)=>{

        const paid = (sub.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0);
        const remaining = sub.price - paid;

        const tr = document.createElement("tr");

        tr.innerHTML = `
        <td>${i+1}</td>
        <td>${sub.name}</td>
        <td>${sub.phone}</td>
        <td>${sub.address}</td>
        <td>${sub.price}</td>
        <td>${paid}</td>
        <td>${remaining}</td>
        <td><button class="print-btn">طباعة</button></td>
        `;

        /* =======================
           طباعة POS
        ======================= */
        tr.querySelector(".print-btn").onclick = async ()=>{

            if(!bluetoothCharacteristic){
                return alert("اربط الطابعة أولاً");
            }

            const last = (sub.payments||[]).slice(-1)[0] || {};

            const text =
`FAST NET
----------------
الاسم: ${sub.name}
الهاتف: ${sub.phone}
العنوان: ${sub.address}

السعر: ${sub.price}
المدفوع: ${paid}
المتبقي: ${remaining}

رقم الإيصال: ${last.receiptNumber || "-"}
التاريخ: ${last.date || "-"}

شكراً لكم`;

            await printImage(text);
        };

        table.appendChild(tr);
    });
});

</script>

</body>
</html>
