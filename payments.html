<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفع - FAST NET</title>

<style>
body { 
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
    padding:20px; 
    direction:rtl; 
    background: linear-gradient(135deg, #f0f4ff, #f9fafc);
    color:#333;
}

h1 { text-align:center; margin-bottom:25px; color:#1a237e; }

.back-btn { 
    background-color: #1a237e; 
    color: white; 
    padding: 15px 35px; 
    margin-bottom:20px; 
    font-size: 20px; 
    font-weight: bold; 
    border-radius: 8px; 
    cursor: pointer; 
    border: none; 
}

#search, #filterStatus { 
    padding:10px 12px; 
    width:100%; 
    max-width:400px; 
    display:block; 
    margin:12px auto; 
    border-radius:6px; 
    border:1px solid #bbb; 
}

table { 
    width:100%; 
    border-collapse:collapse; 
    margin-top:15px; 
    background:white; 
}

th, td { 
    padding:12px 10px; 
    border:1px solid #ddd; 
    text-align:center; 
}

button { 
    padding:8px 14px; 
    border:none; 
    border-radius:6px; 
    cursor:pointer; 
}

.print-btn { background:#28a745; color:white; }
.wa-btn { background:#25d366; color:white; }

.status-paid { background:#388e3c; color:white; padding:6px; border-radius:6px; }
.status-partial { background:#f57c00; color:white; padding:6px; border-radius:6px; }
.status-unpaid { background:#c62828; color:white; padding:6px; border-radius:6px; }

input[type=number]{width:75px;text-align:center;}
</style>
</head>

<body>

<h1>الدفع - FAST NET</h1>

<button class="back-btn" onclick="window.location.href='index.html'">العودة للرئيسية</button>

<input type="text" id="search" placeholder="ابحث بالإسم أو رقم الهاتف...">

<select id="filterStatus">
    <option value="all">الكل</option>
    <option value="full">مدفوع كليًا</option>
    <option value="partial">مدفوع جزئيًا</option>
    <option value="unpaid">غير مدفوع</option>
</select>

<table>
<thead>
<tr>
<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>العنوان</th>
<th>سعر الإشتراك</th>
<th>المدفوع</th>
<th>المتبقي</th>
<th>حالة الدفع</th>
<th>الشهر</th>
<th>دفع</th>
<th>طباعة</th>
<th>واتساب</th>
</tr>
</thead>

<tbody id="subscribersTable"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAolIz4UgOSV1oe0XTl8a8pVfg7Pnfs1w",
  authDomain: "pos2026-310b7.firebaseapp.com",
  databaseURL: "https://pos2026-310b7-default-rtdb.firebaseio.com",
  projectId: "pos2026-310b7",
  storageBucket: "pos2026-310b7.appspot.com",
  messagingSenderId: "221592625111",
  appId: "1:221592625111:web:81b9704a1fa790bcd0f592"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const tableBody = document.getElementById("subscribersTable");
const searchInput = document.getElementById("search");
const filterStatus = document.getElementById("filterStatus");

let subscribers = [];

function renderTable(){

    const searchFilter = searchInput.value.toLowerCase();
    const statusFilterValue = filterStatus.value;

    tableBody.innerHTML = "";

    const currentMonth = new Date().getMonth() + 1;

    subscribers.forEach(sub => {

        const paid = sub.payments.reduce((s,p)=>s+Number(p.amount||0),0);
        const remaining = +(sub.price - paid).toFixed(2);

        const status = remaining===0 ? "full" : (paid>0 ? "partial" : "unpaid");

        if(!(statusFilterValue==="all" || status===statusFilterValue)) return;

        const searchMatch = [sub.name, sub.phone, sub.address, sub.price].some(f =>
            f.toString().toLowerCase().includes(searchFilter)
        );

        if(!searchMatch) return;

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td data-label="#">${sub.id}</td>
            <td data-label="الاسم">${sub.name}</td>
            <td data-label="الهاتف">${sub.phone}</td>
            <td data-label="العنوان">${sub.address}</td>
            <td data-label="سعر الإشتراك">$${sub.price}</td>
            <td data-label="المدفوع">$${paid.toFixed(2)}</td>
            <td data-label="المتبقي">$${remaining}</td>
            <td data-label="حالة الدفع" class="status-cell"></td>
            <td data-label="الشهر">${currentMonth}</td>
            <td data-label="دفع"><input type="number"></td>
            <td data-label="طباعة"><button class="print-btn">طباعة</button></td>
            <td data-label="واتساب"><button class="wa-btn">واتساب</button></td>
        `;

        /* ===== حالة الدفع ===== */
        const statusCell = tr.querySelector(".status-cell");

        statusCell.innerHTML =
            remaining===0
            ? `<span class="status-paid">مدفوع كليًا</span>`
            : (paid>0
                ? `<span class="status-partial">مدفوع جزئيًا</span>`
                : `<span class="status-unpaid">غير مدفوع</span>`);

        /* ================= RAWBT PRINT FIX ================= */
        tr.querySelector(".print-btn").onclick = ()=>{

            const last = sub.payments[sub.payments.length-1] || {};
            const totalPaid = sub.payments.reduce((s,p)=>s+Number(p.amount||0),0);
            const remainingPrint = +(sub.price - totalPaid).toFixed(2);

            const text =
`FAST NET
----------------
الاسم: ${sub.name}
الهاتف: ${sub.phone}
العنوان: ${sub.address}

السعر: ${sub.price}
المدفوع: ${totalPaid}
المتبقي: ${remainingPrint}
الشهر: ${last.month || "-"}
التاريخ: ${last.date || "-"}

----------------`;

            // 🔥 الحل الصحيح RawBT
            window.location.href = "rawbt:" + encodeURIComponent(text);
        };

        tableBody.appendChild(tr);
    });
}

onValue(ref(db,"subscribers"), snap=>{
    const data = snap.val() || {};

    subscribers = Object.entries(data).map(([fid,s],i)=>({
        fid,
        id:i+1,
        name:s.name||"",
        phone:s.phone||"",
        address:s.address||"",
        price:Number(s.price||0),
        payments:Array.isArray(s.payments)?s.payments:[]
    }));

    renderTable();
});

searchInput.addEventListener("input", renderTable);
filterStatus.addEventListener("change", renderTable);
</script>

</body>
</html>
