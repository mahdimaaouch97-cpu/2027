<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفع - FAST NET</title>

<style>
body { 
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
    padding:20px; 
    direction:rtl; 
    background: linear-gradient(135deg, #f0f4ff, #f9fafc);
    color:#333;
}
h1 { text-align:center; margin-bottom:25px; color:#1a237e; }

.back-btn { 
    background-color: #1a237e; 
    color: white; 
    padding: 15px 35px; 
    margin-bottom:20px; 
    font-size: 20px; 
    font-weight: bold; 
    border-radius: 8px; 
    cursor: pointer; 
    border: none; 
}

#search, #filterStatus { 
    padding:10px 12px; 
    width:100%; 
    max-width:400px; 
    display:block; 
    margin:12px auto; 
}

table { 
    width:100%; 
    border-collapse:collapse; 
    background:white; 
}

th, td { 
    padding:12px 10px; 
    border:1px solid #ddd; 
    text-align:center; 
}

th { background:#007bff; color:white; }

button { 
    padding:8px 14px; 
    cursor:pointer; 
    margin:2px; 
    border:none; 
    border-radius:6px;
}

.print-btn { background:#28a745; color:white; }
.pay-btn { background:#ffc107; }
.wa-btn { background:#25d366; color:white; }

.status-paid { background:#388e3c; color:white; padding:8px; }
.status-partial { background:#f57c00; color:white; padding:8px; }
.status-unpaid { background:#c62828; color:white; padding:8px; }

input[type=number] { width:75px; }

</style>
</head>

<body>

<h1>الدفع - FAST NET</h1>

<button class="back-btn" onclick="location.href='index.html'">العودة للرئيسية</button>

<input type="text" id="search">
<select id="filterStatus">
<option value="all">الكل</option>
<option value="full">مدفوع كليًا</option>
<option value="partial">مدفوع جزئيًا</option>
<option value="unpaid">غير مدفوع</option>
</select>

<button onclick="connectPrinter()">🔗 ربط الطابعة</button>

<table>
<thead>
<tr>
<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>العنوان</th>
<th>سعر الإشتراك</th>
<th>المدفوع</th>
<th>المتبقي</th>
<th>حالة الدفع</th>
<th>الشهر</th>
<th>دفع</th>
<th>طباعة</th>
<th>واتساب</th>
</tr>
</thead>
<tbody id="subscribersTable"></tbody>
</table>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA...",
  authDomain: "pos2026-310b7.firebaseapp.com",
  databaseURL: "https://pos2026-310b7-default-rtdb.firebaseio.com",
  projectId: "pos2026-310b7",
  storageBucket: "pos2026-310b7.appspot.com",
  messagingSenderId: "221592625111",
  appId: "1:221592625111:web:81b9704a1fa790bcd0f592"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let bluetoothDevice;
let bluetoothCharacteristic;

const tableBody = document.getElementById("subscribersTable");
const searchInput = document.getElementById("search");
const filterStatus = document.getElementById("filterStatus");

let subscribers = [];

/* ================= BLUETOOTH ================= */
window.connectPrinter = async function () {
    try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
        bluetoothCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

        alert("تم الاتصال بالطابعة ✔️");

    } catch (e) {
        alert("فشل الاتصال");
        console.log(e);
    }
};

/* ================= PRINT FIX ONLY ================= */
async function printPOS(text){

    if(!bluetoothCharacteristic){
        return alert("اربط الطابعة أولاً");
    }

    const encoder = new TextEncoder();

    await bluetoothCharacteristic.writeValue(new Uint8Array([0x1B,0x40]));

    const lines = text.split("\n");

    for(let l of lines){
        await bluetoothCharacteristic.writeValue(encoder.encode(l + "\n"));
    }

    await bluetoothCharacteristic.writeValue(encoder.encode("\n\n\n"));
}

/* ================= RENDER ================= */
function renderTable(){

    const search = searchInput.value.toLowerCase();
    const filter = filterStatus.value;

    tableBody.innerHTML = "";

    subscribers.forEach(sub=>{

        const paid = sub.payments.reduce((s,p)=>s+Number(p.amount||0),0);
        const remaining = sub.price - paid;

        const status =
            remaining===0 ? "full" :
            paid>0 ? "partial" : "unpaid";

        if(filter!=="all" && filter!==status) return;

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${sub.id}</td>
            <td>${sub.name}</td>
            <td>${sub.phone}</td>
            <td>${sub.address}</td>
            <td>${sub.price}</td>
            <td>${paid}</td>
            <td>${remaining}</td>
            <td></td>
            <td>${new Date().getMonth()+1}</td>
            <td><input type="number"></td>
            <td><button class="print-btn">طباعة</button></td>
            <td><button class="wa-btn">واتساب</button></td>
        `;

        /* ===== PRINT BUTTON (ONLY FIXED) ===== */
        tr.querySelector(".print-btn").onclick = async ()=>{

            const last = sub.payments[sub.payments.length-1] || {};

            const text =
`FAST NET
----------------
الاسم: ${sub.name}
الهاتف: ${sub.phone}
العنوان: ${sub.address}

السعر: ${sub.price}
المدفوع: ${paid}
المتبقي: ${remaining}

الشهر: ${last.month || "-"}
التاريخ: ${last.date || "-"}`;

            await printPOS(text);
        };

        /* ===== WHATSAPP ===== */
        tr.querySelector(".wa-btn").onclick = ()=>{

            let phone = sub.phone.startsWith("+") ? sub.phone : "+961"+sub.phone;

            const msg = `FAST NET
الاسم: ${sub.name}
المبلغ: ${paid}`;

            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
        };

        tableBody.appendChild(tr);
    });
}

/* ================= FIREBASE ================= */
onValue(ref(db,"subscribers"), snap=>{

    const data = snap.val() || {};

    subscribers = Object.entries(data).map(([fid,s],i)=>({
        fid,
        id:i+1,
        name:s.name||"",
        phone:s.phone||"",
        address:s.address||"",
        price:Number(s.price||0),
        payments:Array.isArray(s.payments)?s.payments:[]
    }));

    renderTable();
});

searchInput.addEventListener("input", renderTable);
filterStatus.addEventListener("change", renderTable);

</script>

</body>
</html>
