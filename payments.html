<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفع - FAST NET</title>

<style>
body { 
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
    padding:20px; 
    direction:rtl; 
    background: linear-gradient(135deg, #f0f4ff, #f9fafc);
    color:#333;
}

h1 { text-align:center; margin-bottom:25px; color:#1a237e; }

.back-btn { 
    background-color: #1a237e; 
    color: white; 
    padding: 15px 35px; 
    margin-bottom:20px; 
    font-size: 20px; 
    border-radius: 8px; 
    cursor: pointer; 
    border: none; 
}

table { width:100%; border-collapse:collapse; background:white; }
th, td { padding:10px; border:1px solid #ddd; text-align:center; font-size:16px; }

.pay-btn { background:#ffc107; color:white; }
.print-btn { background:#28a745; color:white; }
.wa-btn { background:#25d366; color:white; }

.status-paid { background:#388e3c; color:white; padding:5px; border-radius:8px; }
.status-partial { background:#f57c00; color:white; padding:5px; border-radius:8px; }
.status-unpaid { background:#c62828; color:white; padding:5px; border-radius:8px; }
</style>
</head>

<body>

<h1>الدفع - FAST NET</h1>

<button class="back-btn" onclick="window.location.href='index.html'">العودة</button>
<button class="back-btn" onclick="connectPrinter()">ربط الطابعة 🖨️</button>

<input type="text" id="search" placeholder="بحث...">
<select id="filterStatus">
<option value="all">الكل</option>
<option value="full">مدفوع</option>
<option value="partial">جزئي</option>
<option value="unpaid">غير مدفوع</option>
</select>

<table>
<thead>
<tr>
<th>#</th>
<th>الاسم</th>
<th>الهاتف</th>
<th>المتبقي</th>
<th>الحالة</th>
<th>دفع</th>
<th>طباعة</th>
<th>واتساب</th>
</tr>
</thead>
<tbody id="subscribersTable"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAolIz4UgOSbV1oe0XTl8a8pVfg7Pnfs1w",
  authDomain: "pos2026-310b7.firebaseapp.com",
  databaseURL: "https://pos2026-310b7-default-rtdb.firebaseio.com",
  projectId: "pos2026-310b7",
  storageBucket: "pos2026-310b7.appspot.com",
  messagingSenderId: "221592625111",
  appId: "1:221592625111:web:81b9704a1fa790bcd0f592"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let bluetoothDevice;
let bluetoothCharacteristic;
let subscribers = [];

window.connectPrinter = async function () {
    try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
        bluetoothCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

        alert("تم الاتصال بالطابعة ✅");
    } catch (e) {
        alert("فشل الاتصال ❌");
        console.error(e);
    }
};

/* ===== render ===== */
function renderTable(){
    const tableBody = document.getElementById("subscribersTable");
    tableBody.innerHTML = "";

    subscribers.forEach(sub => {

        const paid = sub.payments.reduce((s,p)=>s+Number(p.amount||0),0);
        const remaining = sub.price - paid;

        const tr = document.createElement("tr");

        tr.innerHTML = `
        <td>${sub.id}</td>
        <td>${sub.name}</td>
        <td>${sub.phone}</td>
        <td>$${remaining}</td>
        <td>
            ${remaining==0?'<span class="status-paid">مدفوع</span>':
              remaining<sub.price?'<span class="status-partial">جزئي</span>':
              '<span class="status-unpaid">غير مدفوع</span>'}
        </td>
        <td><input type="number" class="pay"></td>
        <td><button class="print-btn">طباعة</button></td>
        <td><button class="wa-btn">واتساب</button></td>
        `;

        /* ===== POS PRINT ===== */
        tr.querySelector(".print-btn").addEventListener("click", async () => {
            if (!bluetoothCharacteristic) return alert("اربط الطابعة أولاً");

            const last = sub.payments[sub.payments.length-1];
            if (!last) return alert("لا توجد دفعات");

            const total = sub.payments.reduce((s,p)=>s+Number(p.amount||0),0);
            const rem = sub.price - total;

            const text =
`FAST NET
----------------
الاسم: ${sub.name}
الهاتف: ${sub.phone}
المبلغ: ${last.amount}
المتبقي: ${rem}
التاريخ: ${last.date}
----------------
شكراً`;

            const data = new TextEncoder().encode("\x1B\x40" + text + "\n\n\n");

            try {
                await bluetoothCharacteristic.writeValue(data);
            } catch (e) {
                alert("خطأ بالطباعة");
            }
        });

        tableBody.appendChild(tr);
    });
}

/* ===== Firebase load ===== */
onValue(ref(db,"subscribers"), snap=>{
    const data = snap.val() || {};
    subscribers = Object.entries(data).map(([fid,sub],i)=>({
        fid,
        id:i+1,
        name:sub.name,
        phone:sub.phone,
        price:Number(sub.price||0),
        payments:Array.isArray(sub.payments)?sub.payments:[]
    }));
    renderTable();
});
</script>

</body>
</html>
