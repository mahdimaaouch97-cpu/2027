<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DB",
  projectId: "YOUR_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_SENDER",
  appId: "YOUR_APP"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= BLUETOOTH ================= */
let device, server, service, characteristic;

window.connectPrinter = async function () {
    try {
        device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
                '000018f0-0000-1000-8000-00805f9b34fb',
                '00001101-0000-1000-8000-00805f9b34fb'
            ]
        });

        server = await device.gatt.connect();

        try {
            service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
        } catch {
            service = await server.getPrimaryService('00001101-0000-1000-8000-00805f9b34fb');
        }

        const chars = await service.getCharacteristics();

        characteristic = chars.find(c =>
            c.properties.write || c.properties.writeWithoutResponse
        );

        if (!characteristic) throw new Error("No writable characteristic found");

        alert("✔ تم الاتصال بالطابعة");
    } catch (e) {
        alert("❌ خطأ الاتصال: " + e);
    }
};

/* ================= ESC/POS (FIXED) ================= */
function buildESC(text) {
    const enc = new TextEncoder();

    let data = [];

    // INIT PRINTER
    data.push(0x1B, 0x40);

    // CENTER HEADER
    data.push(0x1B, 0x61, 0x01);
    data.push(...enc.encode("FAST NET\n"));
    data.push(...enc.encode("----------------------\n"));

    // LEFT ALIGN
    data.push(0x1B, 0x61, 0x00);

    data.push(...enc.encode(text));

    // FEED LINES
    data.push(10, 10);

    // CUT PAPER
    data.push(0x1D, 0x56, 0x00);

    return new Uint8Array(data);
}

/* ================= SAFE WRITE (IMPORTANT FIX) ================= */
async function sendToPrinter(data) {
    const chunkSize = 180;

    for (let i = 0; i < data.length; i += chunkSize) {
        const chunk = data.slice(i, i + chunkSize);
        await characteristic.writeValue(chunk);
        await new Promise(r => setTimeout(r, 50)); // مهم جدًا للطابعات
    }
}

/* ================= PRINT ================= */
window.printReceipt = async function (sub) {

    if (!characteristic) {
        return alert("⚠️ يجب الاتصال بالطابعة أولاً");
    }

    if (!sub.payments || sub.payments.length === 0) {
        return alert("لا توجد دفعات");
    }

    const last = sub.payments[sub.payments.length - 1];

    const totalPaid = sub.payments.reduce((s, p) => s + Number(p.amount || 0), 0);
    const remaining = +(sub.price - totalPaid).toFixed(2);

    const text =
`
Receipt: ${last.receiptNumber}
Name: ${sub.name}
Phone: ${sub.phone}
Address: ${sub.address}

Price: ${sub.price}
Paid: ${last.amount}
Remaining: ${remaining}

Month: ${last.month}
Date: ${last.date}

----------------------
THANK YOU
`;

    const bytes = buildESC(text);

    try {
        await sendToPrinter(bytes);
        alert("✔ تمت الطباعة بنجاح");
    } catch (e) {
        alert("❌ فشل الطباعة: " + e);
    }
};

/* ================= TABLE ================= */
const tableBody = document.getElementById("subscribersTable");

onValue(ref(db, "subscribers"), snap => {
    const data = snap.val() || {};
    tableBody.innerHTML = "";

    Object.entries(data).forEach(([fid, sub], i) => {

        sub.payments = Array.isArray(sub.payments) ? sub.payments : [];

        const paid = sub.payments.reduce((s,p)=>s+Number(p.amount||0),0);
        const remaining = sub.price - paid;

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${i+1}</td>
            <td>${sub.name}</td>
            <td>${sub.phone}</td>
            <td>${sub.address}</td>
            <td>$${sub.price}</td>
            <td>$${paid}</td>
            <td>$${remaining}</td>
            <td>${remaining<=0 ? "مدفوع" : "غير مدفوع"}</td>
            <td>
                <input type="number" class="payInput">
                <button class="payBtn">دفع</button>
            </td>
            <td><button class="printBtn">طباعة</button></td>
        `;

        /* PAY */
        tr.querySelector(".payBtn").onclick = async () => {
            const input = tr.querySelector(".payInput");
            const amount = Number(input.value);

            if (!amount || amount <= 0) return alert("مبلغ غير صحيح");

            const receiptNumber = Date.now();

            sub.payments.push({
                amount,
                date: new Date().toLocaleDateString(),
                month: new Date().getMonth() + 1,
                receiptNumber
            });

            await update(ref(db, "subscribers/" + fid), {
                payments: sub.payments
            });

            input.value = "";
            alert("تم الدفع");
        };

        /* PRINT */
        tr.querySelector(".printBtn").onclick = () => {
            printReceipt(sub);
        };

        tableBody.appendChild(tr);
    });
});
</script>
